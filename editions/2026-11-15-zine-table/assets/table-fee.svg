<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 274" role="img" aria-labelledby="zine-title zine-desc">
  <title id="zine-title">Where the six dollars from a booklet sale go</title>
  <desc id="zine-desc">Two of the six dollars pay for materials and four go toward the table. Six groups of four dollars add up to the twenty-four-dollar fixed table fee.</desc>
  <rect width="440" height="274" fill="#fbf4e7"/>
  <g font-family="system-ui, sans-serif" fill="#23382f">
    <text x="18" y="35" font-size="21" font-weight="700">A buyer hands you $6</text>
    <circle cx="48" cy="83" r="23" fill="#e3cfa3" stroke="#294439" stroke-width="1.5"/>
    <text x="48" y="89" fill="#28382d" text-anchor="middle" font-size="17" font-weight="700">$1</text>
    <circle cx="113" cy="83" r="23" fill="#e3cfa3" stroke="#294439" stroke-width="1.5"/>
    <text x="113" y="89" fill="#28382d" text-anchor="middle" font-size="17" font-weight="700">$1</text>
    <circle cx="178" cy="83" r="23" fill="#27594c" stroke="#294439" stroke-width="1.5"/>
    <text x="178" y="89" fill="#fff" text-anchor="middle" font-size="17" font-weight="700">$1</text>
    <circle cx="243" cy="83" r="23" fill="#27594c" stroke="#294439" stroke-width="1.5"/>
    <text x="243" y="89" fill="#fff" text-anchor="middle" font-size="17" font-weight="700">$1</text>
    <circle cx="308" cy="83" r="23" fill="#27594c" stroke="#294439" stroke-width="1.5"/>
    <text x="308" y="89" fill="#fff" text-anchor="middle" font-size="17" font-weight="700">$1</text>
    <circle cx="373" cy="83" r="23" fill="#27594c" stroke="#294439" stroke-width="1.5"/>
    <text x="373" y="89" fill="#fff" text-anchor="middle" font-size="17" font-weight="700">$1</text>
    <g fill="none" stroke="#314c41" stroke-width="2"><path d="M25 111 V119 H136 V111"/><path d="M154 111 V119 H396 V111"/></g>
    <text x="82" y="143" text-anchor="middle" font-size="15">$2 materials</text>
    <text x="275" y="143" text-anchor="middle" font-size="15">$4 toward the table</text>
    <text x="18" y="182" font-size="17" font-weight="700">After six booklet sales</text>
    <rect x="20" y="195" width="60" height="38" rx="3" fill="#d2e2d3"/>
    <text x="50" y="220" text-anchor="middle" font-size="17" font-weight="650">$4</text>
    <rect x="86" y="195" width="60" height="38" rx="3" fill="#d2e2d3"/>
    <text x="116" y="220" text-anchor="middle" font-size="17" font-weight="650">$4</text>
    <rect x="152" y="195" width="60" height="38" rx="3" fill="#d2e2d3"/>
    <text x="182" y="220" text-anchor="middle" font-size="17" font-weight="650">$4</text>
    <rect x="218" y="195" width="60" height="38" rx="3" fill="#d2e2d3"/>
    <text x="248" y="220" text-anchor="middle" font-size="17" font-weight="650">$4</text>
    <rect x="284" y="195" width="60" height="38" rx="3" fill="#d2e2d3"/>
    <text x="314" y="220" text-anchor="middle" font-size="17" font-weight="650">$4</text>
    <rect x="350" y="195" width="60" height="38" rx="3" fill="#d2e2d3"/>
    <text x="380" y="220" text-anchor="middle" font-size="17" font-weight="650">$4</text>
    <text x="19" y="258" font-size="16">6 × $4 covers the $24 fee</text>
  </g>
</svg>
