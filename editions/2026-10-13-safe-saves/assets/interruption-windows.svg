<svg viewBox="0 0 900 280" role="img" aria-labelledby="state-title state-desc" xmlns="http://www.w3.org/2000/svg"><title id="state-title">Interruption windows: direct overwrite versus staged replacement</title><desc id="state-desc">On a top lane, direct overwrite can expose a partial destination before the write finishes. On a bottom lane, staged replacement leaves old bytes visible until a successful swap, then shows the whole new version. Neither lane demonstrates power-loss durability.</desc>
      <g font-family="system-ui,-apple-system,sans-serif"><text x="22" y="29" fill="#142941" font-size="16" font-weight="800">VISIBLE DOCUMENT AT A SNAPSHOT IN TIME</text>
      <text x="22" y="75" fill="#974527" font-size="15" font-weight="800">DIRECT WRITE</text><rect x="173" y="51" width="185" height="53" rx="12" fill="#dce7eb"/><rect x="365" y="51" width="185" height="53" rx="12" fill="#f7cbaf"/><rect x="557" y="51" width="185" height="53" rx="12" fill="#f7cbaf"/>
      <g fill="#1c3649" font-size="16" font-weight="730" text-anchor="middle"><text x="265" y="83">old complete</text><text x="457" y="83">partial new</text><text x="649" y="83">may stop here</text></g>
      <text x="22" y="173" fill="#0f7160" font-size="15" font-weight="800">STAGED SWAP</text><rect x="173" y="147" width="185" height="53" rx="12" fill="#dce7eb"/><rect x="365" y="147" width="185" height="53" rx="12" fill="#dce7eb"/><rect x="557" y="147" width="185" height="53" rx="12" fill="#bfe9d8"/>
      <g fill="#1c3649" font-size="16" font-weight="730" text-anchor="middle"><text x="265" y="179">old complete</text><text x="457" y="179">old complete</text><text x="649" y="179">new complete</text></g>
      <path d="M358 78 h7 M550 78 h7 M358 174 h7 M550 174 h7" stroke="#526e7c" stroke-width="3"/><text x="365" y="231" fill="#3b5165" font-size="13">Files are shown conceptually, not as measured bytes or probability.</text><text x="365" y="249" fill="#3b5165" font-size="13">Illustrates process interruption only; power loss is not modeled.</text></g></svg>
