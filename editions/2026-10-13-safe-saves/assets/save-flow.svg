<svg viewBox="0 0 900 300" role="img" aria-labelledby="save-flow-title save-flow-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="save-flow-title">Four-stage save: stage, flush, replace, sync parent</title><desc id="save-flow-desc">Four labeled cards connected by arrows. Stage a sibling temporary file, flush and fsync its bytes, atomically replace the document path, then try syncing the parent directory. The old document remains the visible target until stage three.</desc>
      <defs><marker id="arr1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#247a78" stroke-width="2"/></marker></defs>
      <g font-family="system-ui,-apple-system,sans-serif"><rect x="12" y="50" width="194" height="157" rx="16" fill="#e8f3f8" stroke="#43738f" stroke-width="2"/><rect x="238" y="50" width="194" height="157" rx="16" fill="#e8f3f8" stroke="#43738f" stroke-width="2"/><rect x="464" y="50" width="194" height="157" rx="16" fill="#dbf5e8" stroke="#24705a" stroke-width="2"/><rect x="690" y="50" width="194" height="157" rx="16" fill="#fff0d9" stroke="#ac7833" stroke-width="2"/>
      <g fill="#154566" font-size="14" font-weight="800"><text x="29" y="80">01 / STAGE</text><text x="255" y="80">02 / SYNC</text><text x="481" y="80" fill="#185f4c">03 / REPLACE</text><text x="707" y="80" fill="#82511c">04 / DIR SYNC</text></g>
      <g fill="#172943" font-size="18" font-weight="800"><text x="29" y="113">Write temp</text><text x="255" y="113">Flush + fsync</text><text x="481" y="113">Swap pathname</text><text x="707" y="113">Persist name</text></g>
      <g fill="#3a5165" font-size="13"><text x="29" y="144">Same directory</text><text x="29" y="165">as destination</text><text x="255" y="144">File bytes</text><text x="255" y="165">requested on disk</text><text x="481" y="144">Readers can open</text><text x="481" y="165">the new version</text><text x="707" y="144">Best effort on</text><text x="707" y="165">supporting POSIX FS</text></g>
      <path d="M209 128 H231 M435 128 H457 M661 128 H683" fill="none" stroke="#247a78" stroke-width="3" marker-end="url(#arr1)"/>
      <path d="M22 238 H437" stroke="#c16d3e" stroke-width="3" stroke-dasharray="7 6"/><circle cx="22" cy="238" r="5" fill="#c16d3e"/><text x="22" y="262" fill="#924d2c" font-size="14" font-weight="750">Old target still available before swap</text>
      <path d="M477 238 H878" stroke="#208b6e" stroke-width="3"/><circle cx="477" cy="238" r="5" fill="#208b6e"/><text x="527" y="262" fill="#0c725c" font-size="14" font-weight="750">New pathname visible after swap</text></g>
    </svg>
