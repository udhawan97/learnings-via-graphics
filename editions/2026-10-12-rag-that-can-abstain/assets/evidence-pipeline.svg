<svg viewBox="0 0 1050 380" role="img" aria-labelledby="pipeline-title pipeline-desc" xmlns="http://www.w3.org/2000/svg">
          <title id="pipeline-title">RAG evidence pipeline with a conditional abstention branch</title>
          <desc id="pipeline-desc">The user question passes through an authorization gate, hybrid retrieval, evidence relevance and support checks. Supported evidence can be sent to a bounded LLM answer generator and cited. Missing or unauthorized evidence routes to abstention or human help. Retrieval content is untrusted data, not control instructions.</desc>
          <defs><marker id="arrow-one" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7" fill="none" stroke="#256c80" stroke-width="2"/></marker><marker id="arrow-abstain" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7" fill="none" stroke="#b84d43" stroke-width="2"/></marker></defs>
          <rect x="15" y="70" width="170" height="115" rx="15" fill="#d3e8fe" stroke="#28598a" stroke-width="2"/><text x="100" y="108" font-size="19" font-weight="750" text-anchor="middle" fill="#173c68">Question</text><text x="100" y="135" font-size="16" text-anchor="middle" fill="#173c68">What is policy?</text><text x="100" y="159" font-size="13" text-anchor="middle" fill="#375a7a">user + tenant ID</text>
          <rect x="235" y="70" width="168" height="115" rx="15" fill="#c8f0e6" stroke="#0e7464" stroke-width="2"/><text x="319" y="108" font-size="19" font-weight="750" text-anchor="middle" fill="#07584c">Access gate</text><text x="319" y="135" font-size="15" text-anchor="middle" fill="#07584c">authorized docs</text><text x="319" y="159" font-size="13" text-anchor="middle" fill="#245f54">ACL / tenant filter</text>
          <rect x="455" y="70" width="168" height="115" rx="15" fill="#d3e8fe" stroke="#28598a" stroke-width="2"/><text x="539" y="108" font-size="19" font-weight="750" text-anchor="middle" fill="#173c68">Retrieve</text><text x="539" y="135" font-size="15" text-anchor="middle" fill="#173c68">text + vector</text><text x="539" y="159" font-size="13" text-anchor="middle" fill="#375a7a">rank, cite, filter</text>
          <rect x="675" y="70" width="168" height="115" rx="15" fill="#ffedcc" stroke="#bd8319" stroke-width="2"/><text x="759" y="108" font-size="18" font-weight="750" text-anchor="middle" fill="#784e08">Evidence?</text><text x="759" y="135" font-size="15" text-anchor="middle" fill="#784e08">answer supported?</text><text x="759" y="159" font-size="13" text-anchor="middle" fill="#94691a">threshold + review</text>
          <rect x="884" y="65" width="150" height="125" rx="15" fill="#c8f0e6" stroke="#0e7464" stroke-width="2"/><text x="959" y="103" font-size="18" font-weight="750" text-anchor="middle" fill="#07584c">Generate</text><text x="959" y="132" font-size="15" text-anchor="middle" fill="#07584c">bounded answer</text><text x="959" y="157" font-size="14" text-anchor="middle" fill="#07584c">+ source IDs</text>
          <g stroke="#256c80" stroke-width="3" marker-end="url(#arrow-one)"><path d="M185 128H229"/><path d="M403 128H449"/><path d="M623 128H669"/><path d="M843 128H878"/></g><text x="860" y="111" fill="#07584c" font-size="14" font-weight="700">YES</text>
          <rect x="655" y="260" width="285" height="94" rx="15" fill="#ffe5e3" stroke="#b84d43" stroke-width="2"/><text x="798" y="294" font-size="18" font-weight="750" text-anchor="middle" fill="#802a22">Abstain / human handoff</text><text x="798" y="320" font-size="14" text-anchor="middle" fill="#802a22">no invented policy, log reason</text><path d="M759 185V253" stroke="#b84d43" stroke-width="3" marker-end="url(#arrow-abstain)"/><text x="770" y="225" font-size="14" fill="#9b3a31" font-weight="700">NO</text>
          <text x="20" y="33" font-size="15" font-weight="750" fill="#244c72">Trust boundary: retrieved text is DATA, not authority over application instructions.</text>
          <text x="20" y="317" font-size="14" fill="#375a7a">Design model · not a claim that every managed RAG service uses this exact sequence.</text>
        </svg>
