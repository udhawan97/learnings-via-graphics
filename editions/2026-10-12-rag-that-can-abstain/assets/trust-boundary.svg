<svg viewBox="0 0 960 300" role="img" aria-labelledby="trust-title trust-desc" xmlns="http://www.w3.org/2000/svg"><title id="trust-title">Trust boundary between retrieved document data and application controls</title><desc id="trust-desc">A document source is an untrusted text input. It crosses a guarded data boundary into the application, while the application policy, permissions and output checks stay independently controlled. An instruction found in a document must not become a new system instruction.</desc>
        <rect x="24" y="64" width="300" height="170" rx="18" fill="#ffe3df" stroke="#a84b42" stroke-width="2"/><text x="174" y="101" text-anchor="middle" fill="#742a24" font-size="22" font-weight="800">UNTRUSTED INPUT</text><text x="174" y="138" text-anchor="middle" fill="#742a24" font-size="17">Search hit / PDF / web page</text><text x="174" y="175" text-anchor="middle" fill="#742a24" font-size="14">“Ignore your rules…”</text><text x="174" y="200" text-anchor="middle" fill="#742a24" font-size="14">Treat as literal data</text>
        <path d="M355 25V275" stroke="#bc713b" stroke-width="4" stroke-dasharray="9 9"/><text x="370" y="38" font-size="15" fill="#865226">TRUST BOUNDARY</text>
        <rect x="415" y="64" width="515" height="170" rx="18" fill="#d2ede7" stroke="#167968" stroke-width="2"/><text x="672" y="101" text-anchor="middle" fill="#0c584d" font-size="22" font-weight="800">APPLICATION-OWNED CONTROLS</text><text x="672" y="138" text-anchor="middle" fill="#0c584d" font-size="17">Permissions · system policy · allowlisted tools</text><text x="672" y="175" text-anchor="middle" fill="#0c584d" font-size="17">Support check · citation IDs · safe output</text><text x="672" y="208" text-anchor="middle" fill="#0c584d" font-size="14">Never promote retrieved text to authority</text>
        <path d="M323 147H411" stroke="#9e5745" stroke-width="3"/><path d="M398 141L411 147L398 153" stroke="#9e5745" stroke-width="3" fill="none"/>
      </svg>
