<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative EV fast-charge power taper</title>
  <desc id="desc">A three-stage chart. At low charge the car and station negotiate. Through the middle the car accepts high power. Around eighty percent state of charge the accepted power slopes down. A note says the curve is illustrative and varies by vehicle, temperature, and charger.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6" fill="none" stroke="#173f73" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="900" height="520" rx="28" fill="url(#panel)"/>
  <text x="50" y="54" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#102a43">The car accepts less power near full</text>
  <text x="50" y="84" font-family="system-ui, sans-serif" font-size="16" fill="#334e68">Conceptual pattern — not a charging curve for a specific vehicle</text>

  <line x1="92" y1="400" x2="842" y2="400" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="92" y1="400" x2="92" y2="122" stroke="#486581" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="810" y="446" font-family="system-ui, sans-serif" font-size="17" text-anchor="end" fill="#243b53">Battery state of charge (SOC)</text>
  <text x="30" y="255" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle" fill="#243b53" transform="rotate(-90 30 255)">Relative power accepted</text>

  <rect x="110" y="130" width="170" height="248" rx="16" fill="#d9eafd" stroke="#2f6fa9" stroke-width="2"/>
  <rect x="280" y="130" width="390" height="248" fill="#dff5e8" stroke="#2b7a4b" stroke-width="2"/>
  <rect x="670" y="130" width="150" height="248" rx="16" fill="#fff0cf" stroke="#a76608" stroke-width="2"/>

  <path d="M130 322 C160 245 205 190 270 180 C390 162 540 164 650 174 C702 184 752 240 802 332" fill="none" stroke="#0b5cab" stroke-width="10" stroke-linecap="round"/>
  <circle cx="670" cy="184" r="9" fill="#a34f00"/>
  <line x1="670" y1="142" x2="670" y2="400" stroke="#a34f00" stroke-width="3" stroke-dasharray="8 8"/>

  <g font-family="system-ui, sans-serif" fill="#102a43">
    <text x="195" y="232" font-size="20" font-weight="700" text-anchor="middle">1 · Negotiate</text>
    <text x="195" y="260" font-size="15" text-anchor="middle">car + station</text>
    <text x="475" y="232" font-size="20" font-weight="700" text-anchor="middle">2 · High-power middle</text>
    <text x="475" y="260" font-size="15" text-anchor="middle">if conditions allow</text>
    <text x="745" y="232" font-size="20" font-weight="700" text-anchor="middle">3 · Taper</text>
    <text x="745" y="260" font-size="15" text-anchor="middle">power falls</text>
    <text x="670" y="424" font-size="16" font-weight="700" text-anchor="middle" fill="#7c3d00">often around 80%</text>
    <text x="110" y="424" font-size="15" text-anchor="middle">low SOC</text>
    <text x="820" y="424" font-size="15" text-anchor="middle">near full</text>
  </g>

  <rect x="92" y="468" width="728" height="32" rx="10" fill="#ffffff" stroke="#9fb3c8"/>
  <text x="456" y="490" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#334e68">Actual shape varies with vehicle, battery temperature, chemistry, software, charger, and site conditions.</text>
</svg>
