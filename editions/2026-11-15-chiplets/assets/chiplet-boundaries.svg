<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Monolithic die and chiplet package comparison</title>
  <desc id="desc">On the left, one large die contains compute and input-output blocks. On the right, four compute chiplets and one input-output chiplet share a package and connect through a die-to-die fabric. A note says each boundary creates an engineering budget.</desc>
  <defs>
    <style>
      .panel{fill:#fbf8ef;stroke:#294c40;stroke-width:4}
      .die{fill:#cfe6d6;stroke:#17553f;stroke-width:4}
      .io{fill:#f4d3a9;stroke:#87400e;stroke-width:4}
      .link{stroke:#6c3f91;stroke-width:8;stroke-linecap:round}
      .label{font:700 25px system-ui,sans-serif;fill:#1e302b}
      .small{font:600 20px system-ui,sans-serif;fill:#1e302b}
      .note{font:700 22px system-ui,sans-serif;fill:#5a2f78}
    </style>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text class="label" x="240" y="48" text-anchor="middle">One monolithic die</text>
  <text class="label" x="720" y="48" text-anchor="middle">One package, five dies</text>
  <rect class="panel" x="55" y="75" width="370" height="355" rx="22"/>
  <rect class="die" x="95" y="115" width="290" height="275" rx="18"/>
  <text class="label" x="240" y="210" text-anchor="middle">Compute + cache</text>
  <rect class="io" x="135" y="270" width="210" height="78" rx="12"/>
  <text class="small" x="240" y="319" text-anchor="middle">Input / output</text>
  <rect class="panel" x="535" y="75" width="370" height="355" rx="22"/>
  <line class="link" x1="720" y1="245" x2="720" y2="334"/>
  <line class="link" x1="625" y1="245" x2="695" y2="334"/>
  <line class="link" x1="815" y1="245" x2="745" y2="334"/>
  <rect class="die" x="575" y="115" width="125" height="105" rx="14"/>
  <rect class="die" x="740" y="115" width="125" height="105" rx="14"/>
  <rect class="die" x="575" y="250" width="125" height="105" rx="14"/>
  <rect class="die" x="740" y="250" width="125" height="105" rx="14"/>
  <text class="small" x="637" y="174" text-anchor="middle">Compute 1</text>
  <text class="small" x="802" y="174" text-anchor="middle">Compute 2</text>
  <text class="small" x="637" y="309" text-anchor="middle">Compute 3</text>
  <text class="small" x="802" y="309" text-anchor="middle">Compute 4</text>
  <rect class="io" x="650" y="335" width="140" height="65" rx="12"/>
  <text class="small" x="720" y="376" text-anchor="middle">Input / output</text>
  <text class="note" x="480" y="482" text-anchor="middle">Each die boundary needs a link, power, cooling and test budget.</text>
  <text class="small" x="480" y="518" text-anchor="middle">Conceptual diagram · not to scale</text>
</svg>
